<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MiraStudio</title>
    <script>
      // GitHub Pages fallback: redirect any unknown path back to the repo root.
      // The site uses HashRouter, so normal navigation uses /#/about, /#/services, etc.
      (function () {
        var parts = window.location.pathname.split('/').filter(Boolean);
        var repo = parts.length ? '/' + parts[0] + '/' : '/';
        window.location.replace(window.location.origin + repo + window.location.hash);
      })();
    </script>
  </head>
  <body></body>
</html>
